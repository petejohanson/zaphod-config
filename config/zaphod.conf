# Enable ZMK Studio so the keymap can be edited live at https://zmk.studio
# (connect the keyboard over USB, or BLE, no reflashing required).
CONFIG_ZMK_STUDIO=y

# Studio normally requires pressing a `&studio_unlock` key before it can make
# changes. Disable that so the existing keymap doesn't need a new binding.
CONFIG_ZMK_STUDIO_LOCKING=n
