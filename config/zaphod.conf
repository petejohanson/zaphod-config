# Enable ZMK Studio so the keymap can be edited live at https://zmk.studio
# (connect the keyboard over USB, or BLE, no reflashing required).
CONFIG_ZMK_STUDIO=y

# Studio normally requires pressing a `&studio_unlock` key before it can make
# changes. Disable that so the existing keymap doesn't need a new binding.
CONFIG_ZMK_STUDIO_LOCKING=n

# Display: bongo cat + status widgets
CONFIG_ZAPHOD_BONGO_CAT=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# Bluetooth: more reliable connections/reconnects, and max radio power
# (better range, slightly shorter battery life).
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
